<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Офлайн Заметки</title>
    <link rel="stylesheet" href="https://unpkg.com/chota@latest">
    <link rel="manifest" href="manifest.json">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: #0b0f19;
            color: #e7eaf3;
            min-height: 100vh;
        }

        .page {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .header {
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            background: rgba(255, 255, 255, 0.02);
            padding: 16px 0;
        }

        .header__inner {
            max-width: 900px;
            margin: 0 auto;
            padding: 0 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand {
            font-weight: 700;
            font-size: 20px;
            letter-spacing: 0.3px;
        }

        .brand span {
            color: rgba(99, 102, 241, 0.7);
            margin-left: 8px;
            font-size: 14px;
        }

        .main {
            flex: 1;
            max-width: 900px;
            margin: 0 auto;
            padding: 30px 20px;
            width: 100%;
        }

        .toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .title {
            font-size: 24px;
            font-weight: 600;
        }

        .stats {
            font-size: 14px;
            opacity: 0.7;
            background: rgba(255, 255, 255, 0.03);
            padding: 6px 12px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .form-row {
            display: flex;
            gap: 12px;
            margin-bottom: 24px;
        }

        .form-input {
            flex: 1;
            padding: 12px 16px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            background: rgba(255, 255, 255, 0.04);
            color: #e7eaf3;
            font-size: 16px;
            outline: none;
        }

        .form-input:focus {
            border-color: rgba(99, 102, 241, 0.55);
        }

        .btn {
            padding: 8px 20px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.14);
            background: transparent;
            color: #e7eaf3;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s;
        }

        .btn:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        .btn--primary {
            background: rgba(99, 102, 241, 0.18);
            border: 1px solid rgba(99, 102, 241, 0.55);
        }

        .btn--primary:hover {
            background: rgba(99, 102, 241, 0.3);
        }

        .btn--danger {
            background: rgba(239, 68, 68, 0.12);
            border: 1px solid rgba(239, 68, 68, 0.45);
        }

        .btn--danger:hover {
            background: rgba(239, 68, 68, 0.2);
        }

        .notes-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .note-item {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            transition: transform 0.2s;
        }

        .note-item:hover {
            transform: translateY(-2px);
            border-color: rgba(255, 255, 255, 0.2);
        }

        .note-content {
            flex: 1;
        }

        .note-text {
            font-size: 16px;
            font-weight: 500;
            margin-bottom: 6px;
        }

        .note-date {
            font-size: 12px;
            opacity: 0.6;
        }

        .empty {
            text-align: center;
            padding: 60px 20px;
            border: 1px dashed rgba(255, 255, 255, 0.18);
            border-radius: 12px;
            opacity: 0.7;
        }

        .footer {
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            background: rgba(255, 255, 255, 0.02);
            padding: 16px 0;
            margin-top: 20px;
        }

        .footer__inner {
            max-width: 900px;
            margin: 0 auto;
            padding: 0 20px;
            font-size: 13px;
            opacity: 0.6;
            display: flex;
            justify-content: center;
        }
    </style>
</head>
<body>
    <div class="page">
        <header class="header">
            <div class="header__inner">
                <div class="brand">
                    Заметки Мирэа
                    <span>работаем!</span>
                </div>
            </div>
        </header>

        <main class="main">
            <div class="toolbar">
                <h1 class="title">Заметки</h1>
                <div class="stats" id="stats">0 заметок</div>
            </div>

            <div class="form-row">
                <input type="text" id="note-input" class="form-input" placeholder="Введите заметку..." autocomplete="off">
                <button id="add-btn" class="btn btn--primary">Добавить</button>
            </div>

            <div id="notes-container">
                <div class="empty">Загрузка заметок...</div>
            </div>
        </main>

        <footer class="footer">
            <div class="footer__inner">
                <span>Practice 13: Service Worker</span>
            </div>
        </footer>
    </div>

    <script src="app.js"></script>
</body>
</html>
